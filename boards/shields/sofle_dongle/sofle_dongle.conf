CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Report the halves' battery to a USB-connected host via a second HID interface
# (the BLE Battery Service above is never seen over USB). Needs 2 HID devices:
# HID_0 = keyboard/consumer/mouse (ZMK), HID_1 = battery (src/usb_battery_hid.c).
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_DONGLE_USB_BATTERY=y

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_DISPLAY=n
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y