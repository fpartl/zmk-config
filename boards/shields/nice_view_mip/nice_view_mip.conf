# Replace nice_view's built-in status widget with our own custom screen
# (src/deda_display/) that shows a custom image + battery/connection. Disabling
# NICE_VIEW_WIDGET_STATUS stops nice_view from compiling its own
# zmk_display_status_screen() so ours links instead. Applies only to the halves
# (the shields that include nice_view_mip); the dongle has no display.
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_DEDA_DISPLAY=y
